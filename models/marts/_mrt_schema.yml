version: 2

models:

  # ---------------------------------------------------------------------------
  # FEE REVENUE
  # ---------------------------------------------------------------------------
  - name: fct_fees_revenue
    description: >
      Fee revenue aggregated by fee type, calendar month, and division.
      One row per fee type per month per division. Retail and commercial
      fee types are kept as separate rows so the semantic layer can filter
      cleanly to each division's revenue definition. Standalone fees
      (periodic charges not linked to a transaction) are broken out
      separately from transaction-linked fees but both are included in
      total_fee_revenue.
    columns:
      - name: fee_month
        description: First day of the calendar month the fees were applied. Primary date grain for trend analysis.

      - name: fee_year
        description: Calendar year of fee_month.

      - name: fee_month_num
        description: Calendar month number (1–12) of fee_month.

      - name: fee_type_code
        description: Raw fee type code (MAINT, OD, ATM, POS_INTCH, TRADE_FIN, WIRE, LN_INT, SVC).

      - name: fee_type
        description: Decoded fee type label (e.g. 'Maintenance', 'POS Interchange', 'Trade Finance').

      - name: division_code
        description: Division this fee type belongs to (RB or CB), derived via account → branch → division.

      - name: division_name
        description: Full division name — 'Retail Banking' or 'Commercial Banking'.

      - name: is_retail_fee
        description: True when fee_type_code is MAINT, OD, ATM, or POS_INTCH.

      - name: is_commercial_fee
        description: True when fee_type_code is TRADE_FIN, WIRE, LN_INT, or SVC.

      - name: fee_count
        description: Total number of individual fee records in this fee type / month / division group.

      - name: total_fee_revenue
        description: Sum of fee_amount across all fee records in this group, including standalone fees.

      - name: avg_fee_amount
        description: Average fee amount within this group.

      - name: standalone_fee_count
        description: >
          Number of fee records in this group that are not linked to a transaction
          (is_standalone_fee = true). These are periodic charges such as monthly
          maintenance fees.

      - name: transaction_linked_fee_count
        description: Number of fee records in this group that are linked to a transaction.

      - name: standalone_fee_revenue
        description: Total revenue from standalone fees in this group.

      - name: transaction_linked_fee_revenue
        description: Total revenue from transaction-linked fees in this group.

  # ---------------------------------------------------------------------------
  # CHANNEL MIX
  # ---------------------------------------------------------------------------
  - name: fct_channel_agg
    description: >
      Transaction volume and settlement rates by channel, calendar month,
      and division. One row per channel per month per division. Division
      context is included so Tableau can apply the correct digital adoption
      definition per division — Retail Banking counts MOB and ONL as digital;
      Commercial Banking additionally counts WIRE. The is_digital_retail and
      is_digital_commercial flags are carried through so the semantic layer
      can compute the correct rate without a case statement at query time.
    columns:
      - name: transaction_month
        description: First day of the calendar month. Primary date grain for channel trend analysis.

      - name: transaction_year
        description: Calendar year of transaction_month.

      - name: transaction_month_num
        description: Calendar month number (1-12) of transaction_month.

      - name: transaction_channel_code
        description: Raw channel code (POS, ONL, MOB, BR, ATM, WIRE).

      - name: channel
        description: Decoded channel label (e.g. 'Online', 'Mobile', 'Wire Transfer').

      - name: division_code
        description: Division of the accounts that transacted via this channel this month.

      - name: division_name
        description: Full division name.

      - name: is_digital_retail
        description: >
          True when channel_code is MOB or ONL. Applies the Retail Banking
          definition of a digital channel. Use this flag when computing
          digital adoption rate for Retail Banking.

      - name: is_digital_commercial
        description: >
          True when channel_code is MOB, ONL, or WIRE. Applies the
          Commercial Banking definition of a digital channel. Use this
          flag when computing digital adoption rate for Commercial Banking.

      - name: is_wire
        description: True when channel_code is WIRE.

      - name: transaction_count
        description: Total number of transactions via this channel in this month and division.

      - name: total_volume
        description: Sum of transaction amounts (always positive, pre-sign) for this group.

      - name: avg_transaction_amount
        description: Average transaction amount within this group.

      - name: settled_count
        description: Number of transactions with status Settled in this group.

      - name: pending_count
        description: Number of transactions with status Pending in this group.

      - name: returned_count
        description: Number of transactions with status Returned in this group.

      - name: settled_pct
        description: Percentage of transactions in this group that are Settled (0–100, rounded to 2dp).

      - name: pending_pct
        description: Percentage of transactions in this group that are Pending (0–100, rounded to 2dp).

      - name: returned_pct
        description: Percentage of transactions in this group that are Returned (0–100, rounded to 2dp).

  # ---------------------------------------------------------------------------
  # ACCOUNT SUMMARY
  # ---------------------------------------------------------------------------
  - name: fct_account_summary
    description: >
      One row per account. Extends int_finance__account_customer_bridge with
      aggregated transaction counts, debit/credit volumes, net flow, and fee
      totals. All bridge columns (account, customer, branch, division context)
      are carried through so Tableau can filter by any dimension without
      additional joins. Accounts with no transaction history have transaction
      metrics coalesced to zero and is_dormant_account set to true.
    columns:
      - name: account_id
        description: Primary key. Unique identifier for each account.
        data_tests:
          - unique
          - not_null

      - name: total_transaction_count
        description: Total number of transactions on this account across all time.

      - name: settled_transaction_count
        description: Number of settled transactions on this account.

      - name: pending_transaction_count
        description: Number of pending transactions on this account.

      - name: returned_transaction_count
        description: Number of returned transactions on this account.

      - name: total_debit_volume
        description: >
          Sum of all debit transaction amounts on this account (always positive).
          Represents gross money out.

      - name: total_credit_volume
        description: >
          Sum of all credit transaction amounts on this account (always positive).
          Represents gross money in.

      - name: net_flow
        description: >
          Net of all signed_amount values — total_credit_volume minus
          total_debit_volume. Positive = net inflow, negative = net outflow.

      - name: last_transaction_date
        description: Date of the most recent transaction on this account. Null if no transactions exist.

      - name: first_transaction_date
        description: Date of the earliest transaction on this account. Null if no transactions exist.

      - name: days_since_last_transaction
        description: >
          Number of days between last_transaction_date and today.
          Null for accounts with no transaction history.

      - name: total_fee_count
        description: Total number of fee records charged to this account.

      - name: total_fees_charged
        description: Total fees charged to this account in USD across all time.

      - name: is_dormant_account
        description: >
          True if no transaction has been recorded in the last 90 days, or if
          the account has no transaction history at all. Distinct from
          customer_is_dormant — an open account can be dormant while the
          customer remains active across other accounts.

  # ---------------------------------------------------------------------------
  # CUSTOMER 360
  # ---------------------------------------------------------------------------
  - name: fct_customer_360
    description: >
      One row per customer. The most comprehensive customer-level model in
      the gold layer. Combines customer identity and segmentation from
      int_finance__customers with portfolio stats (account counts and balances),
      transaction behaviour (all-time, 30/90/365-day windows, preferred channel,
      digital ratio), and fee exposure. Division-specific risk and new-customer
      flags are carried from the silver layer so the semantic layer can select
      the correct variant per division without filtering at query time.
    columns:
      - name: customer_id
        description: Primary key. Unique identifier for each customer.
        data_tests:
          - unique
          - not_null

      - name: is_behaviourally_dormant
        description: >
          True if no transaction has been recorded in the last 90 days,
          or if the customer has no transaction history at all. Distinct
          from is_dormant (which reflects the c_st_cd status code) — a
          customer coded as Active can still be behaviourally dormant.

      - name: txn_count_30d
        description: Number of transactions on this customer's accounts in the last 30 days.

      - name: txn_count_90d
        description: Number of transactions on this customer's accounts in the last 90 days.

      - name: txn_count_365d
        description: Number of transactions on this customer's accounts in the last 365 days.

      - name: preferred_channel_code
        description: >
          The channel code used most frequently by this customer across all
          their accounts. Resolved using mode — ties return the first
          alphabetically. Null if the customer has no transactions.

      - name: digital_ratio_retail
        description: >
          Percentage of this customer's transactions that used a digital
          channel under the Retail Banking definition (MOB or ONL).
          0-100, rounded to 2dp. Null if no transactions exist.

      - name: digital_ratio_commercial
        description: >
          Percentage of this customer's transactions that used a digital
          channel under the Commercial Banking definition (MOB, ONL, or WIRE).
          0-100, rounded to 2dp. Null if no transactions exist.

      - name: total_fees_charged
        description: Total fees charged to this customer across all accounts and all time, in USD.

      - name: primary_division_code
        description: >
          The division code of the customer's accounts. In practice, a
          customer's accounts are all within one division, but this uses
          MAX as a safe aggregate. The semantic layer classifies customers
          by customer_segment_code, not this field.

      - name: know_your_cust_flag
        description: >
          KYC completion flag. False for 3 customers — surfaced as a
          compliance alert in the Tableau dashboard. Target is always true.

  # ---------------------------------------------------------------------------
  # DAILY TRANSACTIONS
  # ---------------------------------------------------------------------------
  - name: fct_daily_transactions
    description: >
      One row per calendar day per division. Covers the full transaction
      window of January 2023 to December 2024 — every day in this range
      has at least one transaction so no gap-filling is required. Includes
      total volume, status breakdown (settled/pending/returned), debit/credit
      split, channel type counts, transaction type counts, and digital
      adoption counts under both the retail and commercial definitions.
      Feeds the transaction trend line chart in Tableau.
    columns:
      - name: transaction_date
        description: Calendar date. Primary grain column for the trend line chart.

      - name: division_code
        description: Division this day's transactions belong to (RB or CB).

      - name: total_transaction_count
        description: Total number of transactions on this date for this division.

      - name: settled_volume
        description: >
          Sum of amounts for settled transactions on this date. Used by the
          Retail Banking semantic layer definition of transaction_volume.

      - name: pending_volume
        description: >
          Sum of amounts for pending transactions on this date. Included in
          the Commercial Banking semantic layer definition of transaction_volume
          to account for wire settlement lag.

      - name: net_flow
        description: >
          Net signed flow on this date — total credit volume minus total debit
          volume. Positive = net money in, negative = net money out.

      - name: digital_count_retail_def
        description: Number of transactions classified as digital under the Retail Banking definition (MOB + ONL).

      - name: digital_count_commercial_def
        description: Number of transactions classified as digital under the Commercial Banking definition (MOB + ONL + WIRE).

      - name: avg_settlement_lag_days
        description: Average days between transaction_date and posting_date for transactions on this date.

  # ---------------------------------------------------------------------------
  # BRANCH PERFORMANCE
  # ---------------------------------------------------------------------------
  - name: fct_branch_performance
    description: >
      One row per branch per calendar month. Covers January 2023 to
      December 2024. Built from a cross-join spine of all branches × all
      months, so every branch has a row for every month in the window —
      months with no activity have metrics coalesced to zero. Includes
      account portfolio stats, transaction volume, digital adoption rates
      (both definitions), and a full fee revenue breakdown by fee type.
      Feeds the branch heatmap and region rollup views in Tableau, and
      rolls up cleanly into gold_division_performance.
    columns:
      - name: branch_code
        description: Branch identifier. Part of the composite grain with report_month.

      - name: report_month
        description: First day of the calendar month. Part of the composite grain.

      - name: division_code
        description: Division this branch belongs to (RB or CB).

      - name: accounts_opened
        description: Number of accounts opened at this branch in this calendar month.

      - name: active_account_count
        description: Number of active (open) accounts at this branch as of the end of this month.

      - name: total_fee_revenue
        description: Total fee revenue generated by accounts at this branch in this month, across all fee types.

      - name: digital_pct_retail_def
        description: >
          Percentage of transactions at this branch this month that used a
          digital channel under the Retail Banking definition (MOB + ONL).
          0-100, rounded to 2dp.

      - name: digital_pct_commercial_def
        description: >
          Percentage of transactions at this branch this month that used a
          digital channel under the Commercial Banking definition (MOB + ONL + WIRE).
          0-100, rounded to 2dp.

  # ---------------------------------------------------------------------------
  # DIVISION PERFORMANCE
  # ---------------------------------------------------------------------------
  - name: fct_division_performance
    description: >
      One row per division per calendar month. A clean rollup of
      gold_branch_performance to the division level — division totals always
      reconcile with branch totals in Tableau. Extends the branch rollup
      with month-over-month delta columns (fee revenue, transaction volume,
      active accounts, active customers, total balance) computed using LAG
      window functions partitioned by division. These deltas are exposed as
      first-class metrics in the semantic layer so the Tableau scorecard can
      show directional arrows without a calculated field.
    columns:
      - name: report_month
        description: First day of the calendar month. Part of the composite grain with division_code.

      - name: division_code
        description: Division identifier. Part of the composite grain with report_month.

      - name: digital_pct_retail_def
        description: >
          Division-level digital adoption rate under the Retail Banking
          definition. Recomputed from raw counts at division level rather
          than averaged from branch percentages, to avoid weighting errors
          when branches have different transaction volumes.

      - name: digital_pct_commercial_def
        description: >
          Division-level digital adoption rate under the Commercial Banking
          definition. Includes WIRE transactions in the numerator.

      - name: mom_transaction_volume_delta
        description: >
          Month-over-month change in total_transaction_volume. Null for the
          first month of data per division (no prior period to compare against).

      - name: mom_fee_revenue_delta
        description: >
          Month-over-month change in total_fee_revenue. Null for the first
          month of data per division. Exposed as a first-class metric in the
          semantic layer for the Tableau division scorecard.

      - name: mom_active_account_delta
        description: >
          Month-over-month change in active_account_count. Positive = net
          account growth, negative = net account contraction.

      - name: mom_active_customer_delta
        description: Month-over-month change in active_customer_count.

      - name: mom_balance_delta
        description: Month-over-month change in total_balance across all accounts in this division.

      - name: mom_fee_revenue_pct_change
        description: >
          Month-over-month percentage change in total_fee_revenue.
          0-100 scale, rounded to 2dp. Null for the first month of data
          and for any month where the prior month had zero fee revenue.

      - name: branch_count
        description: Number of distinct branches that contributed data to this division in this month.